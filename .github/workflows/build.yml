name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

defaults:
  run:
    working-directory: SpaceMind

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Get NSFW model
        run: |
          mkdir -p app/src/main/assets
          OUT=app/src/main/assets/nsfw.tflite
          if [ -s "$OUT" ]; then
            echo "nsfw.tflite already in repo, skipping download"
            ls -l app/src/main/assets
            exit 0
          fi
          URLS="
          https://github.com/devzwy/open_nsfw_android/raw/dev/app/src/main/assets/nsfw.tflite
          https://download.fr71.com/open/nsfw.tflite
          ${NSFW_MODEL_URL}
          "
          for U in $URLS; do
            echo "Trying $U"
            if curl -fL --retry 2 -o /tmp/model.bin "$U"; then
              SIZE=$(stat -c%s /tmp/model.bin)
              MAGIC=$(dd if=/tmp/model.bin bs=1 skip=4 count=4 2>/dev/null)
              echo "size=$SIZE magic=$MAGIC"
              if [ "$SIZE" -gt 500000 ] && [ "$MAGIC" = "TFL3" ]; then
                cp /tmp/model.bin "$OUT"
                echo "Model OK from $U"
                ls -l app/src/main/assets
                exit 0
              fi
            fi
          done
          echo "ERROR: kono link-e valid model paoa jayni. nsfw.tflite file ta repo-r SpaceMind/app/src/main/assets e upload koro."
          exit 1
        env:
          NSFW_MODEL_URL: ${{ vars.NSFW_MODEL_URL }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceMind-debug-apk
          path: SpaceMind/app/build/outputs/apk/debug/app-debug.apk
