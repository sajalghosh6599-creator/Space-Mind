name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

defaults:
  run:
    working-directory: SpaceMind

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Get NSFW model
        run: |
          mkdir -p app/src/main/assets
          OUT=app/src/main/assets/nsfw.tflite
          if [ -s "$OUT" ]; then
            echo "nsfw.tflite already in repo, skipping"
            exit 0
          fi
          check() {
            f="$1"
            [ -f "$f" ] || return 1
            s=$(stat -c%s "$f")
            m=$(dd if="$f" bs=1 skip=4 count=4 2>/dev/null)
            [ "$s" -gt 500000 ] && [ "$m" = "TFL3" ]
          }
          mkdir -p /tmp/src
          for R in devzwy/open_nsfw_android nexas105/flutter_nsfw_scaner; do
            for B in dev master main; do
              D=/tmp/src/$(echo "$R-$B" | tr '/' '_')
              if git clone --depth 1 --branch "$B" "https://github.com/$R.git" "$D" 2>/dev/null; then
                echo "Cloned $R ($B). tflite files found:"
                find "$D" -iname '*.tflite' -exec ls -l {} \;
                for F in $(find "$D" -iname 'nsfw.tflite'); do
                  if check "$F"; then
                    cp "$F" "$OUT"
                    echo "Model OK: $F"
                    ls -l app/src/main/assets
                    exit 0
                  fi
                done
              fi
            done
          done
          echo "ERROR: model paoa jayni. nsfw.tflite file ta SpaceMind/app/src/main/assets e upload koro."
          exit 1

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceMind-debug-apk
          path: SpaceMind/app/build/outputs/apk/debug/app-debug.apk
