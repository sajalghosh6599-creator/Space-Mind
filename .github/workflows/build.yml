name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

defaults:
  run:
    working-directory: SpaceMind

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download NSFW model
        env:
          MODEL_URL: ${{ vars.NSFW_MODEL_URL || 'https://github.com/nexas105/flutter_nsfw_scaner/releases/download/models-v1/OpenNSFW2.tflite.zip' }}
        run: |
          set -e
          mkdir -p app/src/main/assets tmp_model
          curl -fL --retry 3 -o tmp_model/download.bin "$MODEL_URL"
          if unzip -tq tmp_model/download.bin >/dev/null 2>&1; then
            unzip -o tmp_model/download.bin -d tmp_model/unzipped
            FILE=$(find tmp_model/unzipped -name '*.tflite' | head -n 1)
          else
            FILE=tmp_model/download.bin
          fi
          if [ -z "$FILE" ]; then
            echo "ERROR: .tflite file paoa jayni"
            exit 1
          fi
          cp "$FILE" app/src/main/assets/nsfw.tflite
          ls -l app/src/main/assets

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceMind-debug-apk
          path: SpaceMind/app/build/outputs/apk/debug/app-debug.apk
